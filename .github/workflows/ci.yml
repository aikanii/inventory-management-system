name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit, strict)
        run: pnpm typecheck

      # Unit tests are pure; integration tests boot a real PostgreSQL (PGlite)
      # in-process, so the suite needs no service containers.
      - name: Unit + integration tests
        run: pnpm test

      - name: Build API and web bundle
        run: pnpm build

      - name: Boot the built app and probe it
        run: |
          node bin/ims.js migrate
          node bin/ims.js start --port 3000 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/readyz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/healthz
          curl -fsS http://127.0.0.1:3000/api/v1/meta
          curl -fsS -o /dev/null -w 'web bundle: %{http_code}\n' http://127.0.0.1:3000/

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
